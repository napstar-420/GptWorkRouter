# Release: test, build all four platforms and publish to GitHub Releases.
#   1. Bump "version" in package.json and commit.
#   2. git tag -a v<version> -m "one-line release note" && git push && git push origin v<version>
# Run it by hand (Actions > Release > Run workflow) to test and build without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  release:
    # macOS: the build unpacks .zip downloads with macOS tar (bsdtar).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0" # bundled into every release as its Node: bump on purpose
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Build all platforms
        # Release note: the tag's message (git tag -a v1.2.3 -m "note"), else the commit subject.
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true
          NOTES="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          node installer/build-release.mjs --notes "${NOTES:-$(git log -1 --format=%s)}"

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs --yes
